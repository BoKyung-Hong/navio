spring:
  application:
    name: navio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/navio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:navio}
    password: ${DB_PASSWORD:navio_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 개발 단계: update / 운영: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false       # Phase 2에서 메일 설정 후 다시 켤 것

navio:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-32-or-more-characters-secret-key}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY:1800000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}
  toss:
    secret-key: ${TOSS_SECRET_KEY:test_sk_DUMMY}
    client-key: ${TOSS_CLIENT_KEY:test_ck_DUMMY}
    api-base-url: https://api.tosspayments.com/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.navio: DEBUG
    org.hibernate.SQL: DEBUG
